name: ai-fail-closed

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *" # UTC, Beijing 11:37

permissions:
  contents: write

concurrency:
  group: ai-fail-closed
  cancel-in-progress: true

jobs:
  ai-fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate AI fail-closed outputs
        run: python tools/ai-fail-closed/generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dns/ tools/ai-fail-closed/
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "chore: update AI fail-closed DNS rules"
            git push
          fi
